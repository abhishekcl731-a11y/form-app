<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Insurance Form Portal - Validated OCR</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2, h3 { color: #333; }
        button {
            padding: 10px 15px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 3px;
        }
        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* Red highlight class for unextracted/blank fields */
        input.error-field {
            border: 2px solid red !important;
            background-color: #ffe6e6 !important;
        }
        .validation-box {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 4px;
        }
        #ocr-status {
            font-weight: bold;
            color: #d9534f;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Medical Insurance Form - OCR & Validation Portal</h2>
        
        <!-- Google Login Section -->
        <div id="auth-section">
            <button id="login-btn">Login with Google</button>
            <span id="user-info" style="display:none; font-weight: bold; color: green;"></span>
        </div>

        <!-- Form Entry Section -->
        <div id="app-section" style="display:none; margin-top: 20px;">
            <h3>Upload Medical Form Image</h3>
            <input type="file" id="form-image" accept="image/*">
            <div id="ocr-status"></div>
            <br>

            <h3>Verify & Validate Fields (Red highlights indicate blank values)</h3>
            <div class="grid-container">
                <!-- Column 1 Fields -->
                <div class="field-group"><label>IMAGE NAME</label><input type="text" id="IMAGE_NAME" class="val-input"></div>
                <div class="field-group"><label>RECORD NO</label><input type="text" id="RECORD_NO" class="val-input"></div>
                <div class="field-group"><label>EMAIL ADDRESS</label><input type="text" id="EMAIL_ADDRESS" class="val-input"></div>
                <div class="field-group"><label>RES_ADDRESS</label><input type="text" id="RES_ADDRESS" class="val-input"></div>
                <div class="field-group"><label>STATE_1</label><input type="text" id="STATE_1" class="val-input"></div>
                <div class="field-group"><label>ZIP_1</label><input type="text" id="ZIP_1" class="val-input"></div>
                <div class="field-group"><label>COUNTRY_1</label><input type="text" id="COUNTRY_1" class="val-input"></div>
                <div class="field-group"><label>SEX_1</label><input type="text" id="SEX_1" class="val-input"></div>
                <div class="field-group"><label>HEIGHT</label><input type="text" id="HEIGHT" class="val-input"></div>
                <div class="field-group"><label>WEIGHT</label><input type="text" id="WEIGHT" class="val-input"></div>
                <div class="field-group"><label>BILLER NAME</label><input type="text" id="BILLER_NAME" class="val-input"></div>
                <div class="field-group"><label>SHIPPER NAME</label><input type="text" id="SHIPPER_NAME" class="val-input"></div>
                <div class="field-group"><label>STATE_2</label><input type="text" id="STATE_2" class="val-input"></div>
                <div class="field-group"><label>ZIP_2</label><input type="text" id="ZIP_2" class="val-input"></div>
                <div class="field-group"><label>PH_NO2</label><input type="text" id="PH_NO2" class="val-input"></div>
                <div class="field-group"><label>ALCOHOLIC</label><input type="text" id="ALCOHOLIC" class="val-input"></div>
                <div class="field-group"><label>PAST SURG</label><input type="text" id="PAST_SURG" class="val-input"></div>
                <div class="field-group"><label>DIABETIC</label><input type="text" id="DIABETIC" class="val-input"></div>
                <div class="field-group"><label>POLICY NO</label><input type="text" id="POLICY_NO" class="val-input"></div>
                <div class="field-group"><label>D_B_LIFE ASSURE</label><input type="text" id="D_B_LIFE_ASSURE" class="val-input"></div>
                <div class="field-group"><label>NAME_P_HOLDER</label><input type="text" id="NAME_P_HOLDER" class="val-input"></div>
                <div class="field-group"><label>STM NAME</label><input type="text" id="STM_NAME" class="val-input"></div>
                <div class="field-group"><label>DOB</label><input type="text" id="DOB" class="val-input"></div>
                <div class="field-group"><label>SEX_2</label><input type="text" id="SEX_2" class="val-input"></div>
                <div class="field-group"><label>MEDICINE</label><input type="text" id="MEDICINE" class="val-input"></div>
                <div class="field-group"><label>DOSAGE</label><input type="text" id="DOSAGE" class="val-input"></div>
                <div class="field-group"><label>PILL RATE</label><input type="text" id="PILL_RATE" class="val-input"></div>
                <div class="field-group"><label>COST</label><input type="text" id="COST" class="val-input"></div>
                <div class="field-group"><label>TOTAL AMT</label><input type="text" id="TOTAL_AMT" class="val-input"></div>
                <div class="field-group"><label>REMARK</label><input type="text" id="REMARK" class="val-input"></div>
                
                <!-- Column 2 Fields -->
                <div class="field-group"><label>CUSTOMER NAME</label><input type="text" id="CUSTOMER_NAME" class="val-input"></div>
                <div class="field-group"><label>CITY_1</label><input type="text" id="CITY_1" class="val-input"></div>
                <div class="field-group"><label>PH_NO1</label><input type="text" id="PH_NO1" class="val-input"></div>
                <div class="field-group"><label>D_BIRTH</label><input type="text" id="D_BIRTH" class="val-input"></div>
                <div class="field-group"><label>BLOOD GP</label><input type="text" id="BLOOD_GP" class="val-input"></div>
                <div class="field-group"><label>CITY_2</label><input type="text" id="CITY_2" class="val-input"></div>
                <div class="field-group"><label>COUNTRY_2</label><input type="text" id="COUNTRY_2" class="val-input"></div>
                <div class="field-group"><label>SMOKER</label><input type="text" id="SMOKER" class="val-input"></div>
                <div class="field-group"><label>ALLERGIESED</label><input type="text" id="ALLERGIESED" class="val-input"></div>
                <div class="field-group"><label>P_INST</label><input type="text" id="P_INST" class="val-input"></div>
                <div class="field-group"><label>STM CODE</label><input type="text" id="STM_CODE" class="val-input"></div>
                <div class="field-group"><label>CARD NAME</label><input type="text" id="CARD_NAME" class="val-input"></div>
                <div class="field-group"><label>TABLETS</label><input type="text" id="TABLETS" class="val-input"></div>
                <div class="field-group"><label>SHIPPING COST</label><input type="text" id="SHIPPING_COST" class="val-input"></div>
            </div>

            <!-- Mandatory Validation Checkbox Section -->
            <div class="validation-box">
                <input type="checkbox" id="verify-check">
                <label for="verify-check" style="display:inline; color: #856404; font-weight: bold;">
                    I hereby verify that all extracted and entered details above are thoroughly checked and correct.
                </label>
            </div>

            <!-- Save Button -->
            <button id="save-btn" disabled>Save to Firebase Database</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
